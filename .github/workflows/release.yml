name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, Package & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chrome for Testing
        run: |
          OUT=$(npx -y @puppeteer/browsers install chrome@stable --path "${RUNNER_TEMP}/cft")
          CHROME_PATH=$(echo "$OUT" | tail -n 1 | sed 's/^[^ ]* //')
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Syntax & E2E verification before release
        env:
          BB_HEADED: "1"
        run: |
          node --check brave-bridge.mjs
          node --check mcp.mjs
          node --check brave-extension/background.js
          node --check brave-extension/page.js
          node --check brave-extension/popup.js
          xvfb-run -a --server-args="-screen 0 1280x800x24" npm test

      - name: Build clean release archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/ext/brave-extension/icons dist/full/anievo-brave-bridge/brave-extension/icons
          cp brave-extension/manifest.json brave-extension/background.js brave-extension/page.js \
             brave-extension/popup.html brave-extension/popup.js dist/ext/brave-extension/
          cp brave-extension/icons/*.png dist/ext/brave-extension/icons/

          cp -r dist/ext/brave-extension/* dist/full/anievo-brave-bridge/brave-extension/
          cp -r rules skills dist/full/anievo-brave-bridge/
          cp brave-bridge.mjs mcp.mjs plugin.json mcp_config.json package.json README.md README.en.md LICENSE dist/full/anievo-brave-bridge/

          (cd dist/ext && zip -qr "../anievo-brave-bridge-extension-${TAG}.zip" brave-extension)
          (cd dist/full && zip -qr "../anievo-brave-bridge-${TAG}.zip" anievo-brave-bridge)
          ls -lh dist/*.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "dist/anievo-brave-bridge-${TAG}.zip" "dist/anievo-brave-bridge-extension-${TAG}.zip" --clobber
          else
            gh release create "${TAG}" \
              "dist/anievo-brave-bridge-${TAG}.zip" \
              "dist/anievo-brave-bridge-extension-${TAG}.zip" \
              --title "AniEvo Brave Bridge ${TAG}" \
              --generate-notes
          fi
